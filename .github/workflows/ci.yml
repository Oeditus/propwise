name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Lowest supported version (mix.exs declares `elixir: "~> 1.18"`).
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{matrix.otp}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{matrix.otp}}-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test

  linters:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-28-
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          # Keyed on the OTP/Elixir version too: a PLT built by one toolchain
          # must never be reused by another.
          path: priv/plts
          key: ${{ runner.os }}-plt-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-1.19-28-
      - name: Install dependencies
        run: mix deps.get
      - name: Run quality checks
        run: mix quality.ci

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [linters, test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.linters.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "Quality gate failed"
            exit 1
          fi
          echo "Quality gate passed"

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-28-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests with coverage
        run: mix coveralls.json
        env:
          MIX_ENV: test
